name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-and-lint:
    name: Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  backend-syntax-and-audit:
    name: Backend (Lint, Test & Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify All Backend JS Syntax
        run: |
          cd backend
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Lint Backend Code
        run: |
          cd backend
          npm run lint

      - name: Run Backend Tests & Coverage Report
        run: |
          cd backend
          npm run test:coverage

  secret-leak-audit:
    name: Secret & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan for committed .env files and leaked credentials
        run: |
          COMMITTED_ENVS=$(git ls-files | grep -E "(^|/)\.env$" || true)
          if [ -n "$COMMITTED_ENVS" ]; then
            echo "::error::Found committed .env file(s) in repository index: $COMMITTED_ENVS"
            exit 1
          fi

          LEAKS=$(git grep -nE "(AIzaSy[0-9A-Za-z_-]{33}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|mongodb\+srv://[^<\s]+:[^@\s]+@)" -- ':(exclude).github/workflows/ci.yml' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Potential credential pattern detected in tracked files:"
            echo "$LEAKS"
            exit 1
          fi
          echo "Secret audit clean: No raw .env files or hardcoded credentials found."

  ci-gate:
    name: CI Status Gate
    needs: [frontend-build-and-lint, backend-syntax-and-audit, secret-leak-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pipeline Summary & Enforce Status
        run: |
          echo "### ScanMyCv CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend (Lint, Vitest & Build) | ${{ needs.frontend-build-and-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend (Lint, Node/Supertest & Coverage) | ${{ needs.backend-syntax-and-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret & Credential Audit | ${{ needs.secret-leak-audit.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.frontend-build-and-lint.result }}" != "success" ] || \
             [ "${{ needs.backend-syntax-and-audit.result }}" != "success" ] || \
             [ "${{ needs.secret-leak-audit.result }}" != "success" ]; then
            echo "::error::One or more CI checks failed."
            exit 1
          fi
