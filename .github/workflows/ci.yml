name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-and-lint:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Code
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build

  backend-syntax-and-audit:
    name: Backend (Syntax & Integrity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Verify Backend Syntax Integrity
        run: |
          cd backend
          node --check src/app.js
          node --check src/server.js
          node --check src/services/structuredParser.js
          node --check src/services/fastLocalParser.js
          node --check src/services/geminiService.js
          node --check src/services/localHeuristicAnalyzer.js
          node --check src/controllers/resume.controller.js
          node --check src/controllers/auth.controller.js

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

  secret-leak-audit:
    name: Secret & Credential Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for committed .env files
        run: |
          COMMITTED_ENVS=$(git ls-files | grep -E "(^|/)\.env$" || true)
          if [ -n "$COMMITTED_ENVS" ]; then
            echo "::error::Found committed .env file(s) in repository index: $COMMITTED_ENVS"
            exit 1
          fi
          echo "Secret audit clean: No raw .env files found in git tree."
