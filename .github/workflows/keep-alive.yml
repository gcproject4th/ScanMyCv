name: Backend Keep-Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Backend Service
        run: |
          URL="https://scanmycv-backend.onrender.com/api/health"
          echo "Sending heartbeat ping to $URL..."
          HTTP_STATUS=$(curl -s -S -o response.json -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ -f response.json ]; then
            echo "Payload: $(cat response.json)"
          fi
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Backend is warm and healthy."
          else
            echo "::warning::Backend returned status $HTTP_STATUS"
          fi
